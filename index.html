<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    /* ── Tokens ───────────────────────────────────────────── */
    :root {
      color-scheme: light;

      --bg:        #EEF0F5;
      --surface:   #FFFFFF;
      --border:    #D4D9E4;
      --border-focus: #3B5BDB;
      --text:      #141927;
      --muted:     #6C7388;
      --accent:    #3B5BDB;
      --accent-hov:#2F4AC7;
      --accent-fg: #FFFFFF;
      --danger:    #D93B3B;
      --shadow:    0 2px 6px rgba(20,25,39,0.06), 0 8px 24px rgba(20,25,39,0.08);

      --radius:    12px;
      --radius-sm: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;

        --bg:        #0D0F18;
        --surface:   #161926;
        --border:    #252A3A;
        --border-focus: #5B79F0;
        --text:      #E4E8F4;
        --muted:     #7E86A0;
        --accent:    #5B79F0;
        --accent-hov:#6D88F7;
        --accent-fg: #FFFFFF;
        --shadow:    0 2px 8px rgba(0,0,0,0.4), 0 12px 32px rgba(0,0,0,0.5);
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;

      --bg:        #0D0F18;
      --surface:   #161926;
      --border:    #252A3A;
      --border-focus: #5B79F0;
      --text:      #E4E8F4;
      --muted:     #7E86A0;
      --accent:    #5B79F0;
      --accent-hov:#6D88F7;
      --accent-fg: #FFFFFF;
      --shadow:    0 2px 8px rgba(0,0,0,0.4), 0 12px 32px rgba(0,0,0,0.5);
    }

    /* ── Reset / Base ─────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "DM Sans", system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ── Layout ───────────────────────────────────────────── */
    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      padding-top: max(32px, env(safe-area-inset-top, 32px));
      padding-bottom: max(32px, env(safe-area-inset-bottom, 32px));
    }

    /* ── Logo mark ────────────────────────────────────────── */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      text-decoration: none;
      color: var(--text);
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .logo-name {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    /* ── Card ─────────────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 40px 36px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 28px 24px 24px;
      }
    }

    .card-header {
      margin-bottom: 28px;
    }

    .card-header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.4px;
      color: var(--text);
      text-wrap: balance;
    }

    .card-header p {
      margin-top: 6px;
      font-size: 14px;
      color: var(--muted);
    }

    /* ── Form ─────────────────────────────────────────────── */
    .form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 13px;
      pointer-events: none;
      color: var(--muted);
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }

    .field:focus-within .input-icon {
      color: var(--accent);
    }

    .input-wrap input {
      width: 100%;
      height: 44px;
      padding: 0 14px 0 40px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }

    .input-wrap input::placeholder {
      color: var(--muted);
      opacity: 0.65;
    }

    .input-wrap input:focus {
      border-color: var(--border-focus);
      background: var(--surface);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
    }

    .input-wrap input.error {
      border-color: var(--danger);
    }

    /* Password toggle */
    .pw-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      display: flex;
      align-items: center;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .pw-toggle:hover {
      color: var(--text);
    }

    .pw-toggle:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 1px;
    }

    /* Inline error */
    .field-error {
      font-size: 13px;
      color: var(--danger);
      display: none;
    }

    .field-error.visible {
      display: block;
    }

    /* ── Forgot / row ─────────────────────────────────────── */
    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .field-row label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .forgot-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .forgot-link:hover {
      opacity: 0.78;
    }

    .forgot-link:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
      border-radius: 3px;
    }

    /* ── Submit button ────────────────────────────────────── */
    .btn-primary {
      width: 100%;
      height: 46px;
      padding: 0 20px;
      background: var(--accent);
      color: var(--accent-fg);
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      margin-top: 4px;
    }

    .btn-primary:hover {
      background: var(--accent-hov);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .btn-primary:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 3px;
    }

    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    /* Loading spinner inside button */
    .btn-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }

    .btn-primary.loading .btn-spinner {
      display: block;
    }

    .btn-primary.loading .btn-label {
      opacity: 0.7;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn-spinner {
        animation: none;
        opacity: 0.5;
      }
      .btn-primary, .input-wrap input, .input-icon, .pw-toggle {
        transition: none;
      }
    }

    /* ── Divider ──────────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }

    .divider hr {
      flex: 1;
      border: none;
      border-top: 1px solid var(--border);
    }

    .divider span {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* ── Footer / sign up ─────────────────────────────────── */
    .card-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    .card-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.15s;
    }

    .card-footer a:hover {
      opacity: 0.78;
    }

    .card-footer a:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
      border-radius: 3px;
    }

    /* ── Page footer ──────────────────────────────────────── */
    .page-footer {
      padding: 16px 20px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      opacity: 0.7;
    }

    .page-footer a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="page" role="main">

    <!-- Logo -->
    <a href="#" class="logo" aria-label="Slack Test home">
      <svg class="logo-mark" viewBox="0 0 36 36" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" rx="9" fill="var(--accent)"/>
        <rect x="10" y="10" width="7" height="7" rx="2" fill="white" opacity="0.9"/>
        <rect x="19" y="10" width="7" height="7" rx="2" fill="white" opacity="0.5"/>
        <rect x="10" y="19" width="7" height="7" rx="2" fill="white" opacity="0.5"/>
        <rect x="19" y="19" width="7" height="7" rx="2" fill="white" opacity="0.9"/>
      </svg>
      <span class="logo-name">SlackTest</span>
    </a>

    <!-- Card -->
    <div class="card" role="region" aria-label="Sign in form">

      <div class="card-header">
        <h1>Welcome back</h1>
        <p>Sign in to your workspace to continue.</p>
      </div>

      <form class="form" id="login-form" novalidate>

        <!-- Email -->
        <div class="field" id="field-email">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2.5 4A1.5 1.5 0 0 1 4 2.5h8A1.5 1.5 0 0 1 13.5 4v8a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 12V4Z" stroke="currentColor" stroke-width="1.25"/>
                <path d="M2.5 4.5 8 9l5.5-4.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@company.com"
              autocomplete="email"
              autocapitalize="none"
              spellcheck="false"
              required
              aria-describedby="email-error"
            />
          </div>
          <span class="field-error" id="email-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Password -->
        <div class="field" id="field-password">
          <div class="field-row">
            <label for="password">Password</label>
            <a href="#" class="forgot-link" tabindex="0">Forgot password?</a>
          </div>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2.75" y="7" width="10.5" height="7.25" rx="1.5" stroke="currentColor" stroke-width="1.25"/>
                <path d="M5.25 7V5a2.75 2.75 0 1 1 5.5 0v2" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
                <circle cx="8" cy="10.5" r="1" fill="currentColor"/>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              aria-describedby="password-error"
            />
            <button
              type="button"
              class="pw-toggle"
              id="pw-toggle"
              aria-label="Show password"
              aria-pressed="false"
              tabindex="0"
            >
              <!-- Eye icon (show) -->
              <svg id="icon-eye" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5Z" stroke="currentColor" stroke-width="1.25"/>
                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.25"/>
              </svg>
              <!-- Eye-off icon (hide), hidden by default -->
              <svg id="icon-eye-off" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
                <path d="M2 2l12 12M6.5 6.6A2 2 0 0 0 9.4 9.4M4 4.3C2.4 5.4 1 8 1 8s2.5 5 7 5a7.4 7.4 0 0 0 3.7-1M6.5 3.2A7.7 7.7 0 0 1 8 3c4.5 0 7 5 7 5a11.9 11.9 0 0 1-1.7 2.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="password-error" role="alert" aria-live="polite"></span>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-primary" id="submit-btn">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span class="btn-label">Sign in</span>
        </button>

      </form>

      <div class="divider" aria-hidden="true">
        <hr /><span>or</span><hr />
      </div>

      <div class="card-footer">
        Don't have an account? <a href="#">Request access</a>
      </div>

    </div>

  </main>

  <footer class="page-footer">
    &copy; 2026 SlackTest &nbsp;&middot;&nbsp;
    <a href="#">Privacy</a> &nbsp;&middot;&nbsp;
    <a href="#">Terms</a>
  </footer>

  <script>
    (function () {
      // ── Password visibility toggle ─────────────────────────
      const pwInput   = document.getElementById('password');
      const pwToggle  = document.getElementById('pw-toggle');
      const iconEye   = document.getElementById('icon-eye');
      const iconEyeOff= document.getElementById('icon-eye-off');

      pwToggle.addEventListener('click', function () {
        const isHidden = pwInput.type === 'password';
        pwInput.type = isHidden ? 'text' : 'password';
        pwToggle.setAttribute('aria-pressed', String(isHidden));
        pwToggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        iconEye.style.display    = isHidden ? 'none'  : '';
        iconEyeOff.style.display = isHidden ? ''      : 'none';
      });

      // ── Form validation & submit ───────────────────────────
      const form      = document.getElementById('login-form');
      const emailInput= document.getElementById('email');
      const submitBtn = document.getElementById('submit-btn');

      function showError(fieldId, msg) {
        const el = document.getElementById(fieldId + '-error');
        const input = document.getElementById(fieldId);
        if (el) { el.textContent = msg; el.classList.add('visible'); }
        if (input) input.classList.add('error');
      }

      function clearError(fieldId) {
        const el = document.getElementById(fieldId + '-error');
        const input = document.getElementById(fieldId);
        if (el) { el.textContent = ''; el.classList.remove('visible'); }
        if (input) input.classList.remove('error');
      }

      // Clear errors on input
      emailInput.addEventListener('input', () => clearError('email'));
      pwInput.addEventListener('input',    () => clearError('password'));

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        let valid = true;
        clearError('email');
        clearError('password');

        const email = emailInput.value.trim();
        const pw    = pwInput.value;

        if (!email) {
          showError('email', 'Email address is required.');
          valid = false;
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showError('email', 'Enter a valid email address.');
          valid = false;
        }

        if (!pw) {
          showError('password', 'Password is required.');
          valid = false;
        } else if (pw.length < 6) {
          showError('password', 'Password must be at least 6 characters.');
          valid = false;
        }

        if (!valid) return;

        // Simulate async sign-in
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;

        setTimeout(function () {
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;
          // In a real integration, redirect or call your auth endpoint here.
        }, 1800);
      });
    })();
  </script>
</body>
</html>
